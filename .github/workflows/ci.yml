name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: transactions
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports:
          - 5672:5672
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest

    strategy:
      matrix:
        service: [api-gateway, processor-service, transaction-service, notification-service]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/${{ matrix.service }}/package.json

      - name: Install dependencies
        run: cd apps/${{ matrix.service }} && npm ci

      - name: Run lint
        run: cd apps/${{ matrix.service }} && npm run lint --if-present

      - name: Run build
        run: cd apps/${{ matrix.service }} && npm run build

      - name: Run tests
        run: cd apps/${{ matrix.service }} && npm test --if-present
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/transactions
          REDIS_URL: redis://localhost:6379
          RABBITMQ_URL: amqp://guest:guest@localhost:5672
